        // 5 losowych komnat wybranych do bieżącej rozgrywki
        let selectedRunOrder = [];
        let currentStep = 0;

        let currentPlatforms = [];
        let currentBones = [];
        let currentGate = null;
        let currentRoman = "";

        let gateOpen = false;
        let gameFinished = false;
        let activeChoiceBone = null;
        let message = "";
        let messageTimer = 0;

        // Efekt kupki po złej odpowiedzi
        let poopSpot = null;

        function pickRandomRoomsOrder(totalAvailable, count) {
            const indices = [];
            for (let i = 0; i < totalAvailable; i++) indices.push(i);

            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }

            return indices.slice(0, Math.min(count, indices.length));
        }

        function showMessage(text, frames = 150) {
            message = text;
            messageTimer = frames;
        }

        function updateHUD() {
            const total = selectedRunOrder.length;
            const num = currentStep + 1;
            document.getElementById("mainTitle").innerText = `Misja Rejki – Komnata ${num} / ${total}`;
            document.getElementById("roomBadge").innerText = `Komnata: ${num} / ${total}`;
            document.getElementById("riddleText").innerText = `Zagadka: Brama ma znak ${currentRoman}`;

            const statusEl = document.getElementById("statusText");
            if (gateOpen) {
                statusEl.innerText = "Status: Otwarta!";
                statusEl.style.color = "#4ade80";
            } else {
                statusEl.innerText = "Status: Zamknięta";
                statusEl.style.color = "#fca5a5";
            }
        }

        function loadStep(stepIndex, customMessage = "") {
            currentStep = stepIndex;
            const levelIdx = selectedRunOrder[currentStep];
            const lvl = levelsData[levelIdx];

            currentRoman = lvl.roman;
            currentPlatforms = lvl.platforms.map(p => ({
                x: Math.round(p.x * SCALE),
                y: Math.round(p.y * SCALE),
                w: Math.round(p.w * SCALE),
                h: Math.round(p.h * SCALE)
            }));
            currentBones = lvl.bones.map(b => ({
                x: Math.round(b.x * SCALE),
                y: Math.round(b.y * SCALE),
                w: Math.round(b.w * SCALE),
                h: Math.round(b.h * SCALE),
                value: b.value,
                correct: b.correct,
                taken: false,
                leftAlone: false
            }));
            currentGate = {
                x: Math.round(lvl.gate.x * SCALE),
                y: Math.round(lvl.gate.y * SCALE),
                w: Math.round(lvl.gate.w * SCALE),
                h: Math.round(lvl.gate.h * SCALE)
            };

            gateOpen = false;
            activeChoiceBone = null;
            poopSpot = null;

            player.x = 60;
            player.y = 420;
            player.vx = 0;
            player.vy = 0;
            player.jumpsUsed = 0;
            player.grounded = false;
            player.facingRight = true;

            updateHUD();
            if (customMessage) {
                showMessage(customMessage, 160);
            }
        }

        function startNewRandomRun(customMessage = "") {
            gameFinished = false;
            selectedRunOrder = pickRandomRoomsOrder(levelsData.length, ROOMS_PER_RUN);
            loadStep(0, customMessage);
        }

        function tryJump() {
            if (player.jumpsUsed < player.maxJumps) {
                player.vy = player.jumpsUsed === 0 ? player.jumpPower : player.doubleJumpPower;
                player.jumpsUsed++;
                player.grounded = false;
            }
        }

        function getNearbyBone() {
            const pCenterX = player.x + player.width / 2;
            const pBottomY = player.y + player.height;

            for (const bone of currentBones) {
                if (bone.taken) continue;
                const bCenterX = bone.x + bone.w / 2;
                const bCenterY = bone.y + bone.h / 2;

                const closeX = Math.abs(pCenterX - bCenterX) < 110;
                const closeY =
                    Math.abs(pBottomY - (bone.y + bone.h)) < 80 ||
                    Math.abs(player.y + player.height / 2 - bCenterY) < 80;

                if (closeX && closeY) {
                    return bone;
                }
            }
            return null;
        }

        function spawnPoopBehindReja() {
            const offsetX = player.facingRight ? 18 : player.width - 42;
            const px = Math.min(Math.max(player.x + offsetX, 24), canvas.width - 54);
            const py = player.y + player.height - 3;
            poopSpot = { x: px, y: py, timer: 240 };
        }

        function handleTakeBone(bone) {
            bone.taken = true;
            activeChoiceBone = null;

            if (bone.correct) {
                gateOpen = true;
                updateHUD();
                showMessage("Brawo! Brama otwarta!", 200);
            } else {
                spawnPoopBehindReja();
                showMessage("Zła odpowiedź", 160);
            }
        }

        function handleLeaveBone(bone) {
            bone.leftAlone = true;
            activeChoiceBone = null;
            showMessage("Kość została na miejscu.", 90);
        }

        // 4. STEROWANIE KLAWIATURĄ
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;

            if (e.code === "KeyR" && !e.repeat) {
                startNewRandomRun("Nowa losowa piątka komnat! Powodzenia, Rejko!");
                return;
            }

            if (gameFinished) return;

            const isJumpKey =
                e.code === "Space" ||
                e.code === "ArrowUp" ||
                e.code === "KeyW";

            if (isJumpKey && !e.repeat) {
                tryJump();
            }

            if (e.code === "KeyE" && !e.repeat) {
                const nearby = getNearbyBone();
                if (nearby && !activeChoiceBone) {
                    activeChoiceBone = nearby;
                } else if (activeChoiceBone) {
                    activeChoiceBone = null;
                }
            }

            if (activeChoiceBone && !e.repeat) {
                if (e.code === "Digit1" || e.code === "Numpad1" || e.code === "KeyT") {
                    handleTakeBone(activeChoiceBone);
                } else if (e.code === "Digit2" || e.code === "Numpad2" || e.code === "KeyN") {
                    handleLeaveBone(activeChoiceBone);
                }
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        function overlaps(a, b) {
            return (
                a.x < b.x + b.w &&
                a.x + a.width > b.x &&
                a.y < b.y + b.h &&
                a.y + a.height > b.y
            );
        }

        // 5. LOGIKA GRY
        function update() {
            if (poopSpot) {
                poopSpot.timer--;
                if (poopSpot.timer <= 0) {
                    poopSpot = null;
                }
            }

            if (gameFinished) return;

            const moveLeft = keys["ArrowLeft"] || keys["KeyA"];
            const moveRight = keys["ArrowRight"] || keys["KeyD"];

            if (moveLeft && !moveRight) {
                player.vx = -player.speed;
                player.facingRight = false;
            } else if (moveRight && !moveLeft) {
                player.vx = player.speed;
                player.facingRight = true;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }

            player.vy += gravity;
            player.y += player.vy;
            player.grounded = false;

            for (const plat of currentPlatforms) {
                const nadPlatforma =
                    player.x + player.width - 24 > plat.x &&
                    player.x + 24 < plat.x + plat.w;
                const dotykaGory =
                    player.y + player.height >= plat.y &&
                    player.y + player.height - player.vy <= plat.y + 18;

                if (nadPlatforma && dotykaGory && player.vy >= 0) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                    player.jumpsUsed = 0;
                }
            }

            if (activeChoiceBone) {
                const nearby = getNearbyBone();
                if (!nearby || nearby !== activeChoiceBone) {
                    activeChoiceBone = null;
                }
            }

            if (gateOpen && currentGate && overlaps(player, currentGate)) {
                if (currentStep + 1 < selectedRunOrder.length) {
                    loadStep(
                        currentStep + 1,
                        `Komnata ${currentStep + 2}! Nowa zagadka rzymska!`
                    );
                } else {
                    gameFinished = true;
                    messageTimer = 0;
                }
            }

            if (messageTimer > 0 && !gameFinished) {
                messageTimer--;
            }
        }

        // 6. RYSOWANIE PLATFORM Z RZYMSKICH CEGIEŁEK
        function drawBrickPlatform(plat) {
            const { x, y, w, h } = plat;
            const brickW = 48;
            const brickH = 16;
            const brickPalette = ["#9e7647", "#8c663b", "#a87e4d", "#7d5a33"];

            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.clip();

            ctx.fillStyle = "#362617";
            ctx.fillRect(x, y, w, h);

            const rows = Math.ceil(h / brickH);
            for (let row = 0; row < rows; row++) {
                const offsetX = (row % 2 === 1) ? -brickW / 2 : 0;
                const cols = Math.ceil(w / brickW) + 2;

                for (let col = 0; col < cols; col++) {
                    const bx = x + offsetX + col * brickW;
                    const by = y + row * brickH;
                    const color = brickPalette[(row * 3 + col) % brickPalette.length];

                    ctx.fillStyle = color;
                    ctx.fillRect(bx + 1.5, by + 1.5, brickW - 3, brickH - 3);

                    ctx.fillStyle = "rgba(253, 230, 178, 0.25)";
                    ctx.fillRect(bx + 1.5, by + 1.5, brickW - 3, 3);

                    ctx.fillStyle = "rgba(28, 18, 10, 0.35)";
                    ctx.fillRect(bx + 1.5, by + brickH - 4, brickW - 3, 2.5);
                }
            }

            ctx.fillStyle = "#5c7a38";
            for (let mx = x + 18; mx < x + w - 30; mx += 84) {
                ctx.fillRect(mx, y, 24, 4);
                ctx.fillRect(mx + 6, y + 4, 12, 3);
            }

            ctx.restore();

            ctx.strokeStyle = "#2b1d11";
            ctx.lineWidth = 2.5;
            ctx.strokeRect(x, y, w, h);
        }

        // 7. RYSOWANIE BIAŁEJ KOŚCI Z NUMEREM
        function drawBone(bone) {
            if (bone.taken) return;

            const { x, y, w, h, value } = bone;
            const r = h * 0.42;

            ctx.save();
            ctx.fillStyle = "#f8fafc";
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.roundRect(x + r * 0.6, y + 4, w - r * 1.2, h - 8, 7);
            ctx.fill();
            ctx.stroke();

            const ends = [
                [x + r * 0.7, y + r * 0.75],
                [x + r * 0.7, y + h - r * 0.75],
                [x + w - r * 0.7, y + r * 0.75],
                [x + w - r * 0.7, y + h - r * 0.75]
            ];

            for (const [cx, cy] of ends) {
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.72, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.roundRect(x + r * 0.65, y + 6, w - r * 1.3, h - 12, 6);
            ctx.fill();

            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 22px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(value, x + w / 2, y + h / 2 + 1);

            ctx.restore();
        }

        // 8. RYSOWANIE KRESKÓWKOWEJ KUPKI PO ZŁEJ ODPOWIEDZI
        function drawPoop(spot) {
            if (!spot) return;

            const { x, y } = spot;
            ctx.save();
            ctx.strokeStyle = "#291509";
            ctx.lineWidth = 2.5;
            ctx.fillStyle = "#7c4723";

            ctx.beginPath();
            ctx.ellipse(x + 18, y - 6, 18, 7.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#8b522a";
            ctx.beginPath();
            ctx.ellipse(x + 18, y - 13.5, 13.5, 6.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#9c5d32";
            ctx.beginPath();
            ctx.moveTo(x + 9, y - 18);
            ctx.quadraticCurveTo(x + 18, y - 31, x + 25.5, y - 18);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        // 9. RYSOWANIE SCENY
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (tloZaladowane) {
                ctx.drawImage(tloImg, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "rgba(20, 16, 12, 0.28)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, "#5c4738");
                grad.addColorStop(1, "#33261d");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            for (const plat of currentPlatforms) {
                drawBrickPlatform(plat);
            }

            if (currentGate) {
                if (!gateOpen) {
                    if (bramaZaladowana) {
                        ctx.drawImage(bramaImg, currentGate.x, currentGate.y, currentGate.w, currentGate.h);
                    } else {
                        ctx.fillStyle = "#57534e";
                        ctx.fillRect(currentGate.x, currentGate.y, currentGate.w, currentGate.h);
                        ctx.strokeStyle = "#fbbf24";
                        ctx.lineWidth = 4;
                        ctx.strokeRect(currentGate.x, currentGate.y, currentGate.w, currentGate.h);
                    }

                    ctx.fillStyle = "rgba(28, 25, 23, 0.92)";
                    ctx.fillRect(currentGate.x + 8, currentGate.y + 62, currentGate.w - 16, 46);
                    ctx.strokeStyle = "#fbbf24";
                    ctx.lineWidth = 2.5;
                    ctx.strokeRect(currentGate.x + 8, currentGate.y + 62, currentGate.w - 16, 46);

                    ctx.fillStyle = "#fde68a";
                    ctx.font = "bold 22px Georgia";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "alphabetic";
                    ctx.fillText(currentRoman, currentGate.x + currentGate.w / 2, currentGate.y + 92);
                } else {
                    ctx.fillStyle = "rgba(74, 222, 128, 0.35)";
                    ctx.fillRect(currentGate.x, currentGate.y, currentGate.w, currentGate.h);
                    ctx.strokeStyle = "#4ade80";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(currentGate.x, currentGate.y, currentGate.w, currentGate.h);

                    ctx.fillStyle = "#dcfce7";
                    ctx.font = "bold 18px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "alphabetic";
                    ctx.fillText("WYJŚCIE", currentGate.x + currentGate.w / 2, currentGate.y + 98);
                }
            }

            for (const bone of currentBones) {
                drawBone(bone);
            }

            drawPoop(poopSpot);

            ctx.save();
            if (player.facingRight) {
                drawReja(player.x, player.y);
            } else {
                ctx.translate(player.x + player.width, player.y);
                ctx.scale(-1, 1);
                drawReja(0, 0);
            }
            ctx.restore();

            const nearbyBone = !gameFinished ? getNearbyBone() : null;
            if (nearbyBone) {
                const boxW = activeChoiceBone ? 320 : 165;
                const boxH = 44;
                const boxX = Math.min(
                    Math.max(nearbyBone.x + nearbyBone.w / 2 - boxW / 2, 14),
                    canvas.width - boxW - 14
                );
                const boxY = Math.max(nearbyBone.y - 58, 14);

                ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
                ctx.fillRect(boxX, boxY, boxW, boxH);
                ctx.strokeStyle = "#fbbf24";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(boxX, boxY, boxW, boxH);

                ctx.fillStyle = "#fef08a";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const promptText = activeChoiceBone
                    ? "Weź [1] lub zostaw [2]"
                    : "Kliknij E";
                ctx.fillText(promptText, boxX + boxW / 2, boxY + boxH / 2 + 1);
            }

            if (messageTimer > 0 && !gameFinished) {
                ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
                ctx.fillRect(210, 26, 780, 62);
                ctx.strokeStyle = "#fbbf24";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(210, 26, 780, 62);

                ctx.fillStyle = "#fde68a";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(message, canvas.width / 2, 57);
            }

            if (gameFinished) {
                ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
                ctx.fillRect(150, 130, 900, 400);
                ctx.strokeStyle = "#fbbf24";
                ctx.lineWidth = 4;
                ctx.strokeRect(150, 130, 900, 400);

                ctx.fillStyle = "#fde68a";
                ctx.font = "bold 44px Georgia";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("GRATULACJE! MISJA UKOŃCZONA!", canvas.width / 2, 230);

                ctx.fillStyle = "#f5f5f4";
                ctx.font = "26px Arial";
                ctx.fillText("Rejka pokonała 15 wylosowanych komnat!", canvas.width / 2, 325);

                ctx.fillStyle = "#86efac";
                ctx.font = "bold 24px Arial";
                ctx.fillText("Naciśnij R (lub odśwież F5), aby wylosować nowe komnaty.", canvas.width / 2, 425);
            }
        }

        function drawReja(x, y) {
            if (rejaZaladowana) {
                ctx.drawImage(rejaImg, x, y, player.width, player.height);
            } else {
                ctx.fillStyle = "#38bdf8";
                ctx.fillRect(x, y, player.width, player.height);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        startNewRandomRun();
        gameLoop();
    </script>
